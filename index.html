<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>荒野生存原型</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <header>
        <h1>荒野生存</h1>
        <div class="stats">
          <span>生命 <strong id="health">100</strong></span>
          <span>木材 <strong id="wood">0</strong></span>
          <span>石頭 <strong id="stone">0</strong></span>
          <span>等級 <strong id="level">1</strong></span>
          <span>經驗 <strong id="xp">0</strong>/<strong id="xp-needed">100</strong></span>
          <span>擊敗 <strong id="kills">0</strong></span>
          <span>回合 <strong id="round">1</strong></span>
          <span>時間 <strong id="timer">00:00</strong></span>
          <span>怪物強化 <strong id="enemy-power">×1.00</strong></span>
          <span>怪物種類 <strong id="monster-types">2</strong></span>
          <span>羈絆 <strong id="bond">0</strong></span>
        </div>
      </header>

      <canvas id="world" width="800" height="500" aria-label="遊戲地圖"></canvas>

      <section class="actions" aria-label="遊戲操作">
        <button id="heal">使用木材治療（木材 2）</button>
        <button id="pause">暫停</button>
        <button id="restart">重新開始</button>
      </section>

      <p id="message" role="status">使用方向鍵或 WASD 移動，靠近資源自動收集。</p>

      <section id="pause-screen" class="choice-overlay" aria-label="遊戲暫停" hidden>
        <h2>遊戲暫停</h2>
        <div class="choice-options">
          <button id="resume">繼續遊戲</button>
          <button id="restart-paused">重新開始</button>
        </div>
      </section>

      <section id="skill-selection" class="choice-overlay" aria-label="升級技能選擇" hidden>
        <h2>升級！選擇一項技能</h2>
        <div id="skill-options" class="choice-options"></div>
      </section>

      <section id="evolution-route" class="evolution-route" aria-label="進化路線選擇" hidden>
        <h2>亞古獸進化！需要羈絆 100</h2>
        <div class="route-options">
          <button data-route="greymon">暴龍獸<br /><small>疫苗種／錐形火球攻擊</small></button>
          <button data-route="tyrannomon">暴龍獸（病毒種）<br /><small>近戰斜斬／擊殺吸血</small></button>
          <button data-route="metal">機械暴龍獸<br /><small>機械形態／預備進化戰鬥暴龍獸</small></button>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
